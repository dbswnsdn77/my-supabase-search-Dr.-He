<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈 닥터 (Home Doctor)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 font-sans flex items-center justify-center p-4 md:p-8">

    <div class="w-full max-w-2xl bg-white border-4 border-slate-900 shadow-[10px_10px_0px_0px_rgba(15,23,42,1)] rounded-xl relative overflow-hidden">
        
        <header class="border-b-4 border-slate-900 p-5 bg-emerald-400 flex justify-between items-center sticky top-0 z-50">
            <h1 class="text-2xl font-black tracking-tight cursor-pointer select-none" onclick="navigateTo('page1')">🏥 홈 닥터 (Home Doctor)</h1>
            <div class="relative">
                <button onclick="toggleMenu()" class="bg-white border-2 border-slate-900 px-4 py-2 font-black text-base hover:bg-slate-100 transition active:translate-y-0.5">
                    [메뉴]
                </button>
                <div id="navMenu" class="hidden absolute right-0 mt-2 w-48 bg-white border-2 border-slate-900 font-black text-base z-50 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)]">
                    <button onclick="navigateTo('page1')" class="w-full text-left p-3 hover:bg-slate-100 border-b-2 border-slate-900">1. 증상 입력</button>
                    <button onclick="navigateTo('page2')" class="w-full text-left p-3 hover:bg-slate-100 border-b-2 border-slate-900">2. 진단 및 시간</button>
                    <button onclick="navigateTo('page3')" class="w-full text-left p-3 hover:bg-slate-100">3. 주변 병원 지도</button>
                </div>
            </div>
        </header>

        <div id="page1" class="p-8 space-y-8">
            <div class="bg-blue-50 border-2 border-slate-900 p-8 rounded-xl text-center font-black space-y-3">
                <p class="text-2xl md:text-3xl">“어디가 아프신가요?”</p>
                <p class="text-slate-600 text-base md:text-lg font-bold">증상을 자유롭게 알려주세요</p>
            </div>
            
            <div class="space-y-6">
                <textarea id="symptomInput" placeholder="예: 어제 저녁부터 속이 너무 쓰리고 신물이 위로 올라와요. 통증이 명치까지 번지는 것 같아요." 
                    class="w-full h-48 p-5 border-2 border-slate-900 rounded-xl outline-none focus:bg-slate-50 font-bold text-lg resize-none shadow-inner"></textarea>
                
                <button onclick="submitSymptom()" class="w-full bg-emerald-400 hover:bg-emerald-500 text-slate-900 font-black text-xl py-4 border-2 border-slate-900 rounded-xl shadow-[6px_6px_0px_0px_rgba(15,23,42,1)] transition active:translate-x-0.5 active:translate-y-0.5 active:shadow-none">
                    제출하기
                </button>
            </div>
        </div>

        <div id="page2" class="p-8 space-y-8 hidden">
            <div class="border-2 border-slate-900 rounded-xl overflow-hidden shadow-[4px_4px_0px_0px_rgba(15,23,42,1)]">
                <div class="bg-slate-900 text-white font-black p-4 text-center text-lg tracking-wide">✨ AI 의사 진단 결과</div>
                <div class="p-6 bg-amber-50 space-y-4 font-black text-base md:text-lg">
                    <p class="text-slate-700">🩺 의심 질병: <span id="aiDisease" class="text-blue-600 underline decoration-2">분석 중...</span></p>
                    <p class="text-slate-700">🩺 추천 진료과: <span id="aiDepartment" class="text-emerald-600">분석 중...</span></p>
                    <p class="text-slate-700">💡 한줄 팁: <span id="aiTip" class="text-slate-900 font-bold text-sm md:text-base bg-white/60 p-2 block border border-slate-300 rounded mt-1">분석 중...</span></p>
                </div>
            </div>

            <div class="border-2 border-slate-900 rounded-xl p-6 bg-slate-50 space-y-4">
                <p class="font-black text-center text-xl">📅 언제 방문 하실건가요?</p>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3 font-bold text-base">
                    <select id="visitDate" class="p-3 border-2 border-slate-900 bg-white rounded-lg cursor-pointer md:col-span-1">
                    </select>
                    <select id="visitAmpm" class="p-3 border-2 border-slate-900 bg-white rounded-lg cursor-pointer">
                        <option value="오전">오전</option>
                        <option value="오후" selected>오후</option>
                    </select>
                    <select id="visitHour" class="p-3 border-2 border-slate-900 bg-white rounded-lg cursor-pointer">
                        </select>
                    <select id="visitMinute" class="p-3 border-2 border-slate-900 bg-white rounded-lg cursor-pointer">
                        <option value="00">00분</option>
                        <option value="30">30분</option>
                    </select>
                </div>
            </div>

            <button onclick="submitSchedule()" class="w-full bg-blue-400 hover:bg-blue-500 text-slate-900 font-black text-xl py-4 border-2 border-slate-900 rounded-xl shadow-[6px_6px_0px_0px_rgba(15,23,42,1)] transition active:translate-x-0.5 active:translate-y-0.5 active:shadow-none">
                병원 조회하기
            </button>
        </div>

        <div id="page3" class="p-8 space-y-6 hidden">
            <div class="flex flex-col sm:flex-row gap-3 font-black text-base text-center">
                <div id="matchDept" class="flex-1 bg-blue-100 border-2 border-slate-900 py-3 rounded-lg">[-]</div>
                <div id="matchTime" class="flex-1 bg-amber-100 border-2 border-slate-900 py-3 rounded-lg">[-] 방문 예정</div>
            </div>

            <div class="border-2 border-slate-900 rounded-xl h-72 bg-sky-100 relative overflow-hidden flex items-center justify-center shadow-inner">
                <span class="font-black text-slate-400 tracking-widest text-lg pointer-events-none">[ MAP AREA ]</span>
                
                <div class="absolute top-12 left-1/4 group cursor-pointer">
                    <div class="w-6 h-6 bg-rose-500 border-2 border-slate-900 rounded-full shadow-md animate-bounce"></div>
                    <span class="absolute whitespace-nowrap bg-white text-xs border border-slate-900 font-black px-1.5 py-0.5 rounded -top-7 -left-6">현대내과(🔴)</span>
                </div>
                <div class="absolute bottom-20 left-1/2 group cursor-pointer">
                    <div class="w-6 h-6 bg-green-500 border-2 border-slate-900 rounded-full shadow-md"></div>
                    <span class="absolute whitespace-nowrap bg-white text-xs border border-slate-900 font-black px-1.5 py-0.5 rounded -top-7 -left-6">서울내과(🟢)</span>
                </div>
                <div class="absolute top-32 right-1/4 group cursor-pointer">
                    <div class="w-6 h-6 bg-slate-400 border-2 border-slate-900 rounded-full shadow-md"></div>
                    <span class="absolute whitespace-nowrap bg-white text-xs border border-slate-900 font-black px-1.5 py-0.5 rounded -top-7 -left-6">행복내과(⚫)</span>
                </div>
            </div>

            <div class="space-y-4">
                <h3 class="font-black text-xl flex items-center gap-2">📍 추천 병원 리스트 <span class="text-sm font-bold text-slate-500">(가까운 순)</span></h3>
                <div id="hospitalList" class="space-y-3 font-bold text-base">
                    </div>
            </div>
        </div>

    </div>

    <script>
        // 1. 페이지 방문 날짜(오늘) 기준으로 날짜 선택지 구성 (향후 5일)
        function initDatePicker() {
            const dateSelect = document.getElementById('visitDate');
            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
            
            for (let i = 0; i < 5; i++) {
                const targetDate = new Date();
                targetDate.setDate(targetDate.getDate() + i); // 오늘부터 i일 후 계산
                
                const month = targetDate.getMonth() + 1;
                const date = targetDate.getDate();
                const dayName = weekdays[targetDate.getDay()];
                
                // 가독성 좋은 포맷 형성 (예: 6/18(목))
                let displayFormat = `${month}/${date}(${dayName})`;
                if (i === 0) displayFormat = `오늘 (${displayFormat})`;
                if (i === 1) displayFormat = `내일 (${displayFormat})`;
                
                // option 태그 생성
                const opt = document.createElement('option');
                opt.value = `${month}월 ${date}일`;
                opt.textContent = displayFormat;
                dateSelect.appendChild(opt);
            }
        }

        // 2. 시간 셀렉트 박스 동적 생성 (1시 ~ 12시)
        function initTimePicker() {
            const hourSelect = document.getElementById('visitHour');
            for(let i = 1; i <= 12; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.textContent = i + '시';
                if(i === 2) opt.selected = true; // 기본값 2시 설정
                hourSelect.appendChild(opt);
            }
        }

        // 초기화 실행
        initDatePicker();
        initTimePicker();

        // 3. 내비게이션 메뉴 토글 함수
        function toggleMenu() {
            const menu = document.getElementById('navMenu');
            menu.classList.toggle('hidden');
        }

        // 4. 화면 전환(라우팅) 함수
        function navigateTo(pageId) {
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.add('hidden');
            document.getElementById('page3').classList.add('hidden');
            
            document.getElementById(pageId).classList.remove('hidden');
            document.getElementById('navMenu').classList.add('hidden');
        }

        // 5. [화면 1 -> 화면 2] 증상 제출 로직
        async function submitSymptom() {
            const symptomText = document.getElementById('symptomInput').value.trim();
            if(!symptomText) {
                alert('증상을 입력해 주세요!');
                return;
            }

            navigateTo('page2');

            // 가상 AI 딜레이 연동 시뮬레이션
            setTimeout(() => {
                document.getElementById('aiDisease').textContent = "역류성 식도염";
                document.getElementById('aiDepartment').textContent = "소화기내과";
                document.getElementById('aiTip').textContent = "기름진 음식과 식후 바로 눕는 습관을 피하고 명치 압박을 줄이세요.";
            }, 600);
        }

        // 6. [화면 2 -> 화면 3] 스케줄 확정 및 지도 연동 로직
        function submitSchedule() {
            const dateVal = document.getElementById('visitDate').value;
            const ampm = document.getElementById('visitAmpm').value;
            const hour = document.getElementById('visitHour').value;
            const minute = document.getElementById('visitMinute').value;
            const dept = document.getElementById('aiDepartment').textContent;

            // 화면 3 상단 상태 정보창 업데이트
            document.getElementById('matchDept').textContent = `🩺 ${dept}`;
            document.getElementById('matchTime').textContent = `⏰ ${dateVal} ${ampm} ${hour}시 ${minute}분`;

            // 가상 병원 혼잡도 데이터 셋업
            const targetHospitals = [
                { name: "서울내과의원", dist: "300m", status: "green", desc: "진료중 / 원활 (대기 예상 시간 약 5분)" },
                { name: "현대내과의원", dist: "550m", status: "rose", desc: "진료중 / 혼잡 (현재 환자가 많아 대기 1시간 이상 예상)" },
                { name: "행복내과의원", dist: "700m", status: "slate", desc: "선택하신 시간은 병원 점심시간 또는 휴무일로 진료 불가" }
            ];

            const listContainer = document.getElementById('hospitalList');
            listContainer.innerHTML = '';

            targetHospitals.forEach(h => {
                let badgeColor = "bg-green-500";
                if(h.status === "rose") badgeColor = "bg-rose-500";
                if(h.status === "slate") badgeColor = "bg-slate-400";

                const card = document.createElement('div');
                card.className = "flex items-center gap-4 p-4 bg-white border-2 border-slate-900 rounded-xl hover:bg-slate-50 transition";
                card.innerHTML = `
                    <div class="w-5 h-5 ${badgeColor} border-2 border-slate-900 rounded-full flex-shrink-0"></div>
                    <div>
                        <p class="font-black text-lg text-slate-900">${h.name} <span class="text-sm text-slate-500 font-bold ml-1">${h.dist}</span></p>
                        <p class="text-sm text-slate-600 font-bold mt-0.5">${h.desc}</p>
                    </div>
                `;
                listContainer.appendChild(card);
            });

            navigateTo('page3');
        }
    </script>
</body>
</html>
