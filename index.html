<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase 검색 테스트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">데이터베이스 조회하기</h1>
    
    <form id="searchForm" class="space-y-4">
      <div>
        <label for="searchInput" class="block text-sm font-medium text-gray-700">검색어 입력 (A)</label>
        <input type="text" id="searchInput" placeholder="예: 사과" required
          class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <button type="submit" 
        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
        제출하기
      </button>
    </form>

    <div id="resultArea" class="mt-6 p-4 bg-gray-50 rounded-md hidden">
      <h2 class="text-sm font-semibold text-gray-500">조회 결과:</h2>
      <p id="resultValue" class="mt-2 text-lg text-gray-900 font-medium"></p>
    </div>
  </div>

  <script>
    // 1. Supabase 초기화 (본인의 정보로 변경하세요)
    const SUPABASE_URL = 'https://sowrxhudpugvoytcobsh.supabase.co/rest/v1/'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvd3J4aHVkcHVndm95dGNvYnNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjA1MDAsImV4cCI6MjA5NjEzNjUwMH0.HqtA7_8gn32MILCkJSnpVaN7U_5pmV2OPDBax_9L7js';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. DOM 요소 가져오기
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const resultArea = document.getElementById('resultArea');
    const resultValue = document.getElementById('resultValue');

    // 3. 폼 제출 이벤트 리스너
    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault(); // 새로고침 방지
      
      const inputValue = searchInput.value.trim();
      
      // 로딩 표시
      resultArea.classList.remove('hidden');
      resultValue.textContent = '검색 중...';

      try {
        // 4. Supabase DB에서 조회
        // 'items' 테이블에서 'title'이 사용자가 입력한 값(inputValue)과 일치하는 데이터 중 첫 번째 행을 가져옴
        const { data, error } = await supabase
          .from('items')
          .select('content')
          .eq('title', inputValue)
          .single();

        if (error) throw error;

        // 5. 결과 화면에 표시
        if (data) {
          resultValue.textContent = data.content;
          resultValue.className = "mt-2 text-lg text-green-600 font-bold";
        } else {
          resultValue.textContent = '일치하는 데이터가 없습니다.';
          resultValue.className = "mt-2 text-lg text-red-500";
        }
      } catch (err) {
        console.error(err);
        resultValue.textContent = '데이터를 찾지 못했습니다. (오류 발생)';
        resultValue.className = "mt-2 text-lg text-red-500";
      }
    });
  </script>
</body>
</html>
