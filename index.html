<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈 닥터 (Home Doctor)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 font-sans flex items-center justify-center p-4 md:p-8">

    <div class="w-full max-w-2xl bg-white border-4 border-slate-900 shadow-[10px_10px_0px_0px_rgba(15,23,42,1)] rounded-xl relative overflow-hidden">
        
        <header class="border-b-4 border-slate-900 p-5 bg-emerald-400 flex justify-between items-center sticky top-0 z-50">
            <h1 class="text-2xl font-black tracking-tight cursor-pointer select-none" onclick="navigateTo('page1')">🏥 홈 닥터 (Home Doctor)</h1>
            <div class="relative">
                <button onclick="toggleMenu()" class="bg-white border-2 border-slate-900 px-4 py-2 font-black text-base hover:bg-slate-100 transition active:translate-y-0.5">
                    [메뉴]
                </button>
                <div id="navMenu" class="hidden absolute right-0 mt-2 w-48 bg-white border-2 border-slate-900 font-black text-base z-50 shadow-[4px_4px_0px_0px_rgba(15,23,42,1)]">
                    <button onclick="navigateTo('page1')" class="w-full text-left p-3 hover:bg-slate-100 border-b-2 border-slate-900">1. 증상 입력</button>
                    <button onclick="navigateTo('page2')" class="w-full text-left p-3 hover:bg-slate-100 border-b-2 border-slate-900">2. 진단 및 시간</button>
                    <button onclick="navigateTo('page3')" class="w-full text-left p-3 hover:bg-slate-100">3. 주변 병원 지도</button>
                </div>
            </div>
        </header>

        <div id="page1" class="p-8 space-y-8">
            <div class="bg-blue-50 border-2 border-slate-900 p-8 rounded-xl text-center font-black space-y-3">
                <p class="text-2xl md:text-3xl">“어디가 아프신가요?”</p>
                <p class="text-slate-600 text-base md:text-lg font-bold">내 DB의 10대 진료과 목록을 기준으로 실제 AI가 정밀 분석합니다.</p>
            </div>
            <div class="space-y-6">
                <textarea id="symptomInput" placeholder="예: 어제 밤부터 오른쪽 아랫배가 맹장 터진 것처럼 콕콕 찌르듯이 아파요." 
                    class="w-full h-48 p-5 border-2 border-slate-900 rounded-xl outline-none focus:bg-slate-50 font-bold text-lg resize-none shadow-inner"></textarea>
                <button onclick="submitSymptom()" class="w-full bg-emerald-400 hover:bg-emerald-500 text-slate-900 font-black text-xl py-4 border-2 border-slate-900 rounded-xl shadow-[6px_6px_0px_0px_rgba(15,23,42,1)] transition active:translate-x-0.5 active:translate-y-0.5 active:shadow-none">
                    증상 제출하고 AI 진단받기
                </button>
            </div>
        </div>

        <div id="page2" class="p-8 space-y-8 hidden">
            <div class="border-2 border-slate-900 rounded-xl overflow-hidden shadow-[4px_4px_0px_0px_rgba(15,23,42,1)]">
                <div class="bg-slate-900 text-white font-black p-4 text-center text-lg">✨ AI 실제 분석 결과 (내 DB 기반)</div>
                <div class="p-6 bg-amber-50 space-y-4 font-black text-base md:text-lg">
                    <p class="text-slate-700">🩺 의심 질환: <span id="aiDisease" class="text-blue-600 underline decoration-2">분석 중...</span></p>
                    <p class="text-slate-700">🎯 최종 추천 진료과: <span id="aiDepartment" class="text-xl text-emerald-600 bg-emerald-100 px-2 py-0.5 border border-emerald-400 rounded">분석 중...</span></p>
                    <p class="text-slate-700">💡 행동 가이드: <span id="aiTip" class="text-slate-900 font-bold text-sm md:text-base bg-white/60 p-2 block border border-slate-300 rounded mt-1">분석 중...</span></p>
                </div>
            </div>

            <div class="border-2 border-slate-900 rounded-xl p-6 bg-slate-50 space-y-4">
                <p class="font-black text-center text-xl">📅 언제 방문 하실건가요?</p>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3 font-bold text-base">
                    <select id="visitDate" class="p-3 border-2 border-slate-900 bg-white rounded-lg cursor-pointer"></select>
                    <select id="visitAmpm" class="p-3 border-2 border-slate-900 bg-white rounded-lg cursor-pointer">
                        <option value="AM">오전</option>
                        <option value="PM" selected>오후</option>
                    </select>
                    <select id="visitHour" class="p-3 border-2 border-slate-900 bg-white rounded-lg cursor-pointer"></select>
                    <select id="visitMinute" class="p-3 border-2 border-slate-900 bg-white rounded-lg cursor-pointer">
                        <option value="00">00분</option>
                        <option value="30">30분</option>
                    </select>
                </div>
            </div>

            <button onclick="submitSchedule()" class="w-full bg-blue-400 hover:bg-blue-500 text-slate-900 font-black text-xl py-4 border-2 border-slate-900 rounded-xl shadow-[6px_6px_0px_0px_rgba(15,23,42,1)] transition active:translate-x-0.5 active:translate-y-0.5 active:shadow-none">
                이 진료과 보유한 실제 병원 찾기
            </button>
        </div>

        <div id="page3" class="p-8 space-y-6 hidden">
            <div class="flex flex-col sm:flex-row gap-3 font-black text-base text-center">
                <div id="matchDept" class="flex-1 bg-blue-100 border-2 border-slate-900 py-3 rounded-lg">[-]</div>
                <div id="matchTime" class="flex-1 bg-amber-100 border-2 border-slate-900 py-3 rounded-lg">[-] 방문 예정</div>
            </div>

            <div class="border-2 border-slate-900 rounded-xl h-72 bg-sky-100 relative overflow-hidden flex items-center justify-center shadow-inner">
                <span class="font-black text-slate-400 tracking-widest text-lg pointer-events-none">[ 분당구 DB 연동 가상 MAP ]</span>
                <div id="mapMarkers"></div>
            </div>

            <div class="space-y-4">
                <h3 class="font-black text-xl flex items-center gap-2">📍 추천 병원 리스트 <span class="text-sm font-bold text-slate-500">(데이터베이스 실시간 조회)</span></h3>
                <div id="hospitalList" class="space-y-3 font-bold text-base"></div>
            </div>
        </div>
    </div>

    <script>
        // ===================================================
        // 🔒 AI API Key는 Vercel 환경변수로 이동되어 프론트엔드에서 제거됨!
        // Supabase 키는 익명(Anon) 키이므로 프론트엔드에 노출되어도 무방합니다.
        // ===================================================
        const SUPABASE_URL = "https://sowrxhudpugvoytcobsh.supabase.co/rest/v1/"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvd3J4aHVkcHVndm95dGNvYnNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NjA1MDAsImV4cCI6MjA5NjEzNjUwMH0.HqtA7_8gn32MILCkJSnpVaN7U_5pmV2OPDBax_9L7js";           
        
        // Supabase 클라이언트 초기화
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function timeStringToMinutes(timeStr) {
            if(!timeStr) return null;
            const [hours, minutes] = timeStr.split(':').map(Number);
            return (hours * 60) + minutes;
        }

        function init() {
            const dateSelect = document.getElementById('visitDate');
            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
            for (let i = 0; i < 5; i++) {
                const target = new Date(); target.setDate(target.getDate() + i);
                const format = `${target.getMonth()+1}/${target.getDate()}(${weekdays[target.getDay()]})`;
                const opt = document.createElement('option');
                opt.value = weekdays[target.getDay()];
                opt.textContent = i===0 ? `오늘 (${format})` : i===1 ? `내일 (${format})` : format;
                dateSelect.appendChild(opt);
            }
            const hourSelect = document.getElementById('visitHour');
            for(let i=1; i<=12; i++) {
                let opt = document.createElement('option'); opt.value = i; opt.textContent = i + '시';
                if(i === 2) opt.selected = true; 
                hourSelect.appendChild(opt);
            }
        }
        init();

        function toggleMenu() { document.getElementById('navMenu').classList.toggle('hidden'); }
        function navigateTo(pageId) {
            ['page1', 'page2', 'page3'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
            document.getElementById('navMenu').classList.add('hidden');
        }

        // [화면 1] 내부 Vercel API(/api/diagnose)를 호출하여 결과 받아오기
        async function submitSymptom() {
            const text = document.getElementById('symptomInput').value;
            if(!text.trim()) {
                alert("증상을 상세히 입력해주세요!");
                return;
            }
            
            document.getElementById('aiDisease').textContent = "AI가 증상을 정밀 분석 중입니다...";
            document.getElementById('aiDepartment').textContent = "대조 중...";
            document.getElementById('aiTip').textContent = "잠시만 기다려주세요.";
            navigateTo('page2');

            try {
                // Vercel Serverless Function 호출 (Gemini 연동 백엔드)
                const response = await fetch('/api/diagnose', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ symptom: text }),
                });

                if (!response.ok) {
                    throw new Error("서버 응답 에러");
                }

                const aiResult = await response.json();

                // 화면 UI에 매칭값 세팅
                document.getElementById('aiDisease').textContent = aiResult.disease;
                document.getElementById('aiDepartment').textContent = aiResult.department;
                document.getElementById('aiTip').textContent = aiResult.tip;

            } catch (err) {
                console.error("API 통신 에러:", err);
                alert("서버 연동 오류가 발생하여 기본 '내과'로 백업 전환합니다.");
                document.getElementById('aiDisease').textContent = "급성 위염 의심 (API 통신 오류)";
                document.getElementById('aiDepartment').textContent = "내과";
                document.getElementById('aiTip').textContent = "안정을 취하시고 자극적인 음식을 피해 주세요.";
            }
        }

        // [화면 2 ➡️ 화면 3] 판정된 진료과를 이용해 Supabase DB 실시간 조회 및 운영시간 필터링
async function submitSchedule() {
    const dayOfWeek = document.getElementById('visitDate').value;
    const ampm = document.getElementById('visitAmpm').value;
    let hour = parseInt(document.getElementById('visitHour').value);
    const minute = document.getElementById('visitMinute').value;
    const dept = document.getElementById('aiDepartment').textContent;

    if(ampm === "PM" && hour !== 12) hour += 12;
    if(ampm === "AM" && hour === 12) hour = 0;
    const userTargetTimeString = `${hour.toString().padStart(2, '0')}:${minute}`;
    const userTargetMinutes = timeStringToMinutes(userTargetTimeString);

    document.getElementById('matchDept').textContent = `🩺 ${dept}`;
    document.getElementById('matchTime').textContent = `⏰ 방문예정: ${userTargetTimeString}`;

    const listContainer = document.getElementById('hospitalList');
    const markerContainer = document.getElementById('mapMarkers');
    listContainer.innerHTML = '<p class="text-center font-bold text-emerald-600">내 Supabase DB 원격 테이블 조회 중...</p>';
    markerContainer.innerHTML = '';

    try {
        const { data: dbHospitals, error } = await supabaseClient
            .from('hospital_meta')
            .select(`
                *,
                hospital_departments!inner(department_name)
            `)
            .eq('hospital_departments.department_name', dept);

        if (error) throw error;
        listContainer.innerHTML = '';

        if(!dbHospitals || dbHospitals.length === 0) {
            listContainer.innerHTML = `<p class="text-center text-slate-400 py-4">현재 병원 데이터베이스에 [${dept}]를 진료하는 곳이 등록되어 있지 않습니다.</p>`;
            return;
        }

        // 실제 조건에 맞아 화면에 노출될 병원 수를 카운트하기 위한 변수
        let renderedCount = 0;

        dbHospitals.forEach((h) => {
            const dayMap = { '일':'sun', '월':'mon', '화':'tue', '수':'wed', '목':'thu', '금':'fri', '토':'sat' };
            const prefix = dayMap[dayOfWeek];
            const openTime = h[`${prefix}_open`];   
            const closeTime = h[`${prefix}_close`]; 

            // 1️⃣ [휴무일 체크] 선택한 요일에 운영 시간이 없으면 리스트에서 제외(패스)
            if (!openTime || !closeTime) {
                return; 
            }

            const openMin = timeStringToMinutes(openTime);
            const closeMin = timeStringToMinutes(closeTime);

            // 2️⃣ [운영시간 체크] 방문 예정 시간이 오픈 시간 전이거나 마감 시간 이후면 제외(패스)
            if (userTargetMinutes < openMin || userTargetMinutes >= closeMin) {
                return; 
            }

            // 3️⃣ [점심시간 체크] 점심시간 데이터가 존재할 때만 비교하여 해당 타임이면 제외(패스)
            if (h.lunch_start && h.lunch_end) {
                const lunchStartMinutes = timeStringToMinutes(h.lunch_start);
                const lunchEndMinutes = timeStringToMinutes(h.lunch_end);
                if (userTargetMinutes >= lunchStartMinutes && userTargetMinutes < lunchEndMinutes) {
                    return; 
                }
            }

            // 4️⃣ [출력 진행] 위 조건을 모두 통과한 병원만 아래 코드가 실행되어 화면에 출력됨
            let statusColor = "bg-green-500";
            let textDesc = "🟢 진료중 / 대기 원활";

            if (dayOfWeek === "토" || dayOfWeek === "일") {
                statusColor = "bg-rose-500"; 
                textDesc = "🔴 진료중 / 주말 대기 혼잡";
            }

            // 병원 카드 추가
            const card = document.createElement('div');
            card.className = "flex items-center gap-4 p-4 bg-white border-2 border-slate-900 rounded-xl shadow-[4px_4px_0px_0px_rgba(15,23,42,1)]";
            card.innerHTML = `
                <div class="w-5 h-5 ${statusColor} border-2 border-slate-900 rounded-full flex-shrink-0"></div>
                <div>
                    <p class="font-black text-lg text-slate-900">${h.name}</p>
                    <p class="text-xs text-slate-500 font-bold mt-0.5">📍 ${h.address}</p>
                    <p class="text-sm text-blue-600 font-black mt-1">${textDesc}</p>
                </div>
            `;
            listContainer.appendChild(card);

            // 가상 지도 마커 추가 (실제 렌더링된 순서대로 위치 배치)
            const marker = document.createElement('div');
            marker.className = `absolute w-6 h-6 ${statusColor} border-2 border-slate-900 rounded-full flex items-center justify-center cursor-pointer`;
            marker.style.left = `${20 + (renderedCount * 15)}%`; 
            marker.style.top = `${30 + (renderedCount * 12)}%`;
            marker.innerHTML = `<span class="absolute whitespace-nowrap bg-white text-[10px] border border-slate-900 font-black px-1 rounded -top-5">${h.name.substring(0,6)}</span>`;
            markerContainer.appendChild(marker);

            renderedCount++; // 출력된 병원 수 증가
        });

        // 5️⃣ [예외 처리] 해당 진료과 병원은 존재하지만, 선택한 시간대에 문을 연 곳이 하나도 없을 때
        if (renderedCount === 0) {
            listContainer.innerHTML = `
                <p class="text-center text-slate-500 py-6">
                    💡 선택하신 시간(<span class="text-blue-600 font-black">${userTargetTimeString}</span>)에는 <br>
                    정기 휴무이거나 진료 시간이 종료되어 방문 가능한 [${dept}] 병원이 없습니다.
                </p>`;
        }

        navigateTo('page3');

    } catch (err) {
        console.error("원격 DB 병원 목록 필터링 오류:", err);
        listContainer.innerHTML = `<p class="text-center text-red-500 py-4">Supabase 테이블 조회 도중 장애가 발생했습니다.</p>`;
    }
        }
    </script>
</body>
</html>
